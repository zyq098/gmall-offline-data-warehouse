<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商离线数仓可视化大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a192f;
            color: #e6f1ff;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        .dashboard {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr;
            padding: 10px;
            gap: 10px;
        }
        /* 顶部标题栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(30,58,95,0.6) 0%, rgba(17,34,64,0.3) 100%);
            border: 1px solid #1e3a5f;
            border-radius: 4px;
            position: relative;
        }
        .header h1 {
            font-size: 26px;
            color: #64ffda;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(100,255,218,0.5);
        }
        .header .time {
            position: absolute;
            right: 20px;
            font-size: 14px;
            color: #8892b0;
        }
        /* 主体三栏 */
        .main {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 10px;
            overflow: hidden;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }
        /* 卡片通用样式 */
        .card {
            background: rgba(17,34,64,0.7);
            border: 1px solid #1e3a5f;
            border-radius: 4px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 20px; height: 2px;
            background: #64ffda;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 2px;
            background: #64ffda;
        }
        .card-title {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 8px;
            padding-left: 8px;
            border-left: 3px solid #64ffda;
            flex-shrink: 0;
        }
        .chart { width: 100%; flex: 1; min-height: 0; }
        /* KPI卡片行 */
        .kpi-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }
        .kpi-card {
            background: rgba(17,34,64,0.7);
            border: 1px solid #1e3a5f;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
        }
        .kpi-label { font-size: 12px; color: #8892b0; margin-bottom: 8px; }
        .kpi-value { font-size: 28px; font-weight: bold; color: #64ffda; }
        .kpi-value.blue { color: #0ea5e9; }
        .kpi-value.purple { color: #818cf8; }
        .kpi-value.pink { color: #f472b6; }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 顶部标题 -->
    <div class="header">
        <h1>电商离线数仓可视化大屏</h1>
        <div class="time" id="time"></div>
    </div>
    <!-- 主体三栏 -->
    <div class="main">
        <!-- 左栏 -->
        <div class="column">
            <div class="kpi-row">
                <div class="kpi-card">
                    <div class="kpi-label">今日GMV(元)</div>
                    <div class="kpi-value">489,906</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">订单总数</div>
                    <div class="kpi-value blue">1,064</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">活跃用户</div>
                    <div class="kpi-value purple">3,200</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">支付转化率</div>
                    <div class="kpi-value pink">33.2%</div>
                </div>
            </div>
            <div class="card" style="flex:1">
                <div class="card-title">用户总览</div>
                <div id="pieUser" class="chart"></div>
            </div>
            <div class="card" style="flex:1">
                <div class="card-title">各渠道UV对比</div>
                <div id="barChannel" class="chart"></div>
            </div>
        </div>
        <!-- 中栏 -->
        <div class="column">
            <div class="card" style="flex:1.2">
                <div class="card-title">全国各省交易额分布</div>
                <div id="mapProvince" class="chart"></div>
            </div>
            <div class="card" style="flex:1">
                <div class="card-title">近7日订单/支付趋势</div>
                <div id="lineTrend" class="chart"></div>
            </div>
        </div>
        <!-- 右栏 -->
        <div class="column">
            <div class="card" style="flex:1">
                <div class="card-title">今日数据质量监控</div>
                <div id="lineAlarm" class="chart"></div>
            </div>
            <div class="card" style="flex:1">
                <div class="card-title">品牌销售额Top5</div>
                <div id="barTop5" class="chart"></div>
            </div>
            <div class="card" style="flex:0.8">
                <div class="card-title">品类销售Top5</div>
                <div style="padding:15px; font-size:12px; overflow:auto;">
                    <div style="margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span style="color:#ccd6f6;">厨房小电</span>
                            <span style="color:#64ffda;">¥49,008</span>
                        </div>
                        <div style="height:6px; background:#112240; border-radius:3px; overflow:hidden;">
                            <div style="height:100%; width:100%; background:linear-gradient(90deg, #64ffda, #0ea5e9); border-radius:3px;"></div>
                        </div>
                        <div style="font-size:11px; color:#8892b0; margin-top:2px;">97笔订单</div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span style="color:#ccd6f6;">连衣裙</span>
                            <span style="color:#64ffda;">¥48,036</span>
                        </div>
                        <div style="height:6px; background:#112240; border-radius:3px; overflow:hidden;">
                            <div style="height:100%; width:98%; background:linear-gradient(90deg, #64ffda, #0ea5e9); border-radius:3px;"></div>
                        </div>
                        <div style="font-size:11px; color:#8892b0; margin-top:2px;">39笔订单</div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span style="color:#ccd6f6;">生活电器</span>
                            <span style="color:#64ffda;">¥40,165</span>
                        </div>
                        <div style="height:6px; background:#112240; border-radius:3px; overflow:hidden;">
                            <div style="height:100%; width:81%; background:linear-gradient(90deg, #64ffda, #0ea5e9); border-radius:3px;"></div>
                        </div>
                        <div style="font-size:11px; color:#8892b0; margin-top:2px;">26笔订单</div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span style="color:#ccd6f6;">饼干糕点</span>
                            <span style="color:#64ffda;">¥39,679</span>
                        </div>
                        <div style="height:6px; background:#112240; border-radius:3px; overflow:hidden;">
                            <div style="height:100%; width:80%; background:linear-gradient(90deg, #64ffda, #0ea5e9); border-radius:3px;"></div>
                        </div>
                        <div style="font-size:11px; color:#8892b0; margin-top:2px;">10笔订单</div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span style="color:#ccd6f6;">坚果炒货</span>
                            <span style="color:#64ffda;">¥38,643</span>
                        </div>
                        <div style="height:6px; background:#112240; border-radius:3px; overflow:hidden;">
                            <div style="height:100%; width:78%; background:linear-gradient(90deg, #64ffda, #0ea5e9); border-radius:3px;"></div>
                        </div>
                        <div style="font-size:11px; color:#8892b0; margin-top:2px;">17笔订单</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 时间
function updateTime() {
    document.getElementById('time').innerText = new Date().toLocaleString('zh-CN');
}
setInterval(updateTime, 1000); updateTime();

// 通用样式
const textStyle = { color: '#8892b0', fontSize: 11 };

// 1. 用户总览环形图
echarts.init(document.getElementById('pieUser')).setOption({
    tooltip: { trigger: 'item' },
    legend: { bottom: 0, textStyle: textStyle, itemWidth: 10 },
    series: [{
        type: 'pie', radius: ['40%', '65%'], center: ['50%', '45%'],
        label: { color: '#e6f1ff', fontSize: 11 },
        data: [{"value": 150, "name": "新用户"}, {"value": 3200, "name": "活跃用户"}, {"value": 960, "name": "沉睡用户"}, {"value": 320, "name": "流失用户"}]
    }]
});

// 2. 渠道UV柱状图
echarts.init(document.getElementById('barChannel')).setOption({
    tooltip: { trigger: 'axis' },
    legend: { top: 0, textStyle: textStyle },
    grid: { left: '15%', right: '5%', bottom: '12%', top: '20%' },
    xAxis: { type: 'category', data: ["微信", "APP", "小程序"], axisLabel: textStyle },
    yAxis: { type: 'value', axisLabel: textStyle, splitLine: { lineStyle: { color: '#233554' } } },
    series: [
        { name: '今日UV', type: 'bar', data: [1200,2800,900,600,300], itemStyle: { color: '#64ffda' } },
        { name: '昨日UV', type: 'bar', data: [1050,2500,820,550,280], itemStyle: { color: '#0ea5e9' } },
    ]
});

// 3. 全国地图（用阿里云GeoJSON数据源加载）
const mapChart = echarts.init(document.getElementById('mapProvince'));
fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
    .then(res => res.json())
    .then(geoJson => {
        echarts.registerMap('china', geoJson);
        mapChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}<br/>交易额: {c} 万元' },
            visualMap: {
                min: 0, max: 85859, left: 10, top: 'center',
                orient: 'vertical',
                text: ['高', '低'],
                textStyle: textStyle,
                inRange: { color: ['#0ea5e9', '#64ffda', '#818cf8'] }
            },
            series: [{
                name: '交易额(万元)', type: 'map', map: 'china', roam: false,
                zoom: 1.5,
                center: [108, 36],
                label: { show: false },
                itemStyle: { borderColor: '#1e3a5f' },
                emphasis: {
                    label: { show: true, color: '#e6f1ff' },
                    itemStyle: { areaColor: '#64ffda' }
                },
                data: [
                    { name: '河北省', value: 85 }, { name: '北京市', value: 125 },
                    { name: '上海市', value: 152 }, { name: '广东省', value: 198 },
                    { name: '江苏省', value: 138 }, { name: '浙江省', value: 122 },
                    { name: '山东省', value: 108 }, { name: '四川省', value: 78 },
                    { name: '湖北省', value: 65 }, { name: '福建省', value: 58 },
                    { name: '河南省', value: 72 }, { name: '湖南省', value: 55 },
                    { name: '辽宁省', value: 48 }, { name: '陕西省', value: 42 },
                    { name: '重庆市', value: 50 },
                    { name: '天津市', value: 68 }, { name: '安徽省', value: 62 },
                    { name: '江西省', value: 45 }, { name: '云南省', value: 38 },
                    { name: '广西壮族自治区', value: 52 },
                ]
            }]
        });
    });

// 4. 订单趋势折线
echarts.init(document.getElementById('lineTrend')).setOption({
    tooltip: { trigger: 'axis' },
    legend: { top: 0, textStyle: textStyle },
    grid: { left: '10%', right: '5%', bottom: '12%', top: '20%' },
    xAxis: { type: 'category', data: ['6-02','6-03','6-04','6-05','6-06','6-07','6-08'], axisLabel: textStyle },
    yAxis: { type: 'value', axisLabel: textStyle, splitLine: { lineStyle: { color: '#233554' } } },
    series: [
        { name: '订单量', type: 'line', smooth: true, data: [820,932,901,1034,1290,1330,1250],
          lineStyle: { color: '#64ffda', width: 3 }, itemStyle: { color: '#64ffda' },
          areaStyle: { color: 'rgba(100,255,218,0.2)' } },
        { name: '支付量', type: 'line', smooth: true, data: [620,732,701,834,1090,1130,1050],
          lineStyle: { color: '#0ea5e9', width: 3 }, itemStyle: { color: '#0ea5e9' },
          areaStyle: { color: 'rgba(14,165,233,0.2)' } },
    ]
});

// 5. 数据质量监控
echarts.init(document.getElementById('lineAlarm')).setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: '15%', right: '5%', bottom: '12%', top: '8%' },
    xAxis: { type: 'category', data: ['00:00','04:00','08:00','12:00','16:00','20:00'], axisLabel: textStyle },
    yAxis: { type: 'value', axisLabel: textStyle, splitLine: { lineStyle: { color: '#233554' } } },
    series: [{
        name: '异常次数', type: 'line', smooth: true, data: [12,8,25,45,38,52],
        lineStyle: { color: '#f472b6', width: 2 }, itemStyle: { color: '#f472b6' },
        areaStyle: { color: 'rgba(244,114,182,0.3)' }
    }]
});

// 6. 品牌Top5横向柱状
echarts.init(document.getElementById('barTop5')).setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: '20%', right: '10%', bottom: '8%', top: '8%' },
    xAxis: { type: 'value', axisLabel: textStyle },
    yAxis: { type: 'category', data: ['百草味','小米','优衣库','华为','美的'], axisLabel: textStyle },
    series: [{
        type: 'bar', data: [15,22,26,32,38],
        itemStyle: {
            color: new echarts.graphic.LinearGradient(0,0,1,0, [
                { offset: 0, color: '#0ea5e9' }, { offset: 1, color: '#64ffda' }
            ])
        },
        label: { show: true, position: 'right', color: '#e6f1ff', fontSize: 11 }
    }]
});

// 窗口大小变化时自适应
window.addEventListener('resize', function() {
    document.querySelectorAll('.chart').forEach(function(el) {
        const inst = echarts.getInstanceByDom(el);
        if (inst) inst.resize();
    });
});
</script>
</body>
</html>
